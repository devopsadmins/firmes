semana = 10
titulo = "A guerra invisível"
pilar = "Coragem"
capitulo = "A Guerra Invisível"
complementar = "Seja Homem: Homem, coloque sua armadura (p. 83–90) e Homem, pegue a sua espada (p. 99–110)"
resumo = "Existe uma guerra espiritual real, e ela se vence do jeito que Cristo venceu: com fé, Palavra, oração e obediência no dia comum."

[[dia]]
titulo = "Sóbrio, não assustado"
versiculo = "Sede sóbrios e vigilantes. O diabo, vosso adversário, anda em derredor, como leão que ruge procurando alguém para devorar."
referencia = "1 Pedro 5.8"
leitura = "A Guerra Invisível (p. 260–264)"
texto = [
  "Há dois jeitos de errar sobre o diabo. Um é achar que ele não existe ou não faz nada. O outro é ver demônio em tudo: no pneu furado, na dor de cabeça, na discussão com a esposa. Pedro não alimenta nenhum dos dois. Ele diz que o inimigo é real e pede uma coisa simples: sobriedade.",
  "Sóbrio é o homem de cabeça limpa. Ele não vive com medo nem com fascínio pelo assunto. Ele sabe que o leão procura quem está sozinho, cansado, distraído, longe do rebanho. Por isso vigia os pontos fracos que já conhece.",
  "A maior parte da batalha espiritual não acontece num culto barulhento. Acontece no pensamento que você alimenta, na mágoa que você guarda, na tentação que você deixa entrar porque estava exausto e sem ninguém por perto.",
]
perguntas = [
  "Em que situação eu fico mais vulnerável: cansado, sozinho, irritado, à noite?",
  "Eu tenho levado a guerra espiritual a sério demais ou de menos?",
]
desafio = "Anotar o horário e a situação em que você mais costuma cair e montar hoje uma barreira prática para ela (deixar o celular fora do quarto, avisar um irmão, mudar uma rotina)."
oracao = "Pedir a Deus uma mente sóbria, confessar onde você tem andado distraído e pedir proteção para o seu ponto mais fraco, chamando-o pelo nome."
resposta = "Meu ponto mais vulnerável e a barreira que montei"

[[dia]]
titulo = "Vestido para ficar de pé"
versiculo = "Revesti-vos de toda a armadura de Deus, para poderdes ficar firmes contra as ciladas do diabo."
referencia = "Efésios 6.11"
leitura = "A Guerra Invisível (p. 265–269)"
texto = [
  "Paulo escrevia preso, provavelmente ao lado de um soldado romano. Olhou para o equipamento dele e viu a vida cristã: cinto, couraça, calçado, escudo, capacete, espada. Repare no verbo que ele repete: ficar firme. A armadura não é para impressionar. É para não cair.",
  "Cada peça é uma realidade do evangelho. Verdade, justiça, a paz do evangelho, fé, salvação e a Palavra de Deus (Efésios 6.14-17). Nada disso é técnica secreta. É o que você já recebeu em Cristo, vestido todos os dias de propósito.",
  "O inimigo usa ciladas, não ataques frontais. Ele não costuma propor um grande pecado. Propõe uma pequena mentira, uma concessão razoável, uma noite sem oração. O homem que se veste de manhã está pronto quando a cilada aparece à tarde.",
]
perguntas = [
  "Qual peça da armadura está mais esquecida na minha vida?",
  "Que cilada pequena eu tenho aceitado como se fosse inofensiva?",
]
desafio = "Ler Efésios 6.10-18 em voz alta antes de sair de casa e escolher uma peça para vestir conscientemente hoje. À noite, anotar onde ela fez diferença."
oracao = "Agradecer por tudo o que Cristo já lhe deu, pedir para viver hoje na verdade e na fé, e pedir olhos para enxergar as ciladas antes de cair nelas."
resposta = "A peça que vesti e onde ela fez diferença"

[[dia]]
titulo = "Está escrito"
versiculo = "Está escrito: Não só de pão viverá o homem, mas de toda palavra que procede da boca de Deus."
referencia = "Mateus 4.4"
leitura = "A Guerra Invisível (p. 270–274)"
texto = [
  "Jesus estava com fome depois de 40 dias no deserto. O tentador chegou com propostas que pareciam razoáveis: pão, proteção, poder. Jesus não discutiu, não fez um sermão sobre o diabo e não usou nenhuma fórmula especial. Respondeu três vezes com a Escritura.",
  "A Palavra é a única peça de ataque da armadura (Efésios 6.17). Mas ninguém empunha uma espada que deixou em casa. Jesus citou Deuteronômio de cor, no meio da fome. Ele tinha guardado aquilo antes da hora da prova.",
  "Muito homem enfrenta a tentação com força de vontade e perde. A força de vontade cansa. A verdade de Deus guardada no coração continua de pé quando você está com fome, com raiva ou sozinho.",
]
perguntas = [
  "Que mentira eu escuto com frequência na hora da tentação?",
  "Que versículo responde a essa mentira, e eu o sei de cor?",
]
desafio = "Escolher um versículo que responda diretamente à sua tentação mais comum, escrevê-lo num papel ou na tela de bloqueio e decorá-lo até a noite."
oracao = "Agradecer porque Cristo venceu a tentação no seu lugar, pedir amor pela Palavra e pedir que o versículo de hoje venha à memória na hora certa."
resposta = "A mentira que escuto e o versículo que responde"

[[dia]]
titulo = "Resistir de joelhos"
versiculo = "Sujeitai-vos, portanto, a Deus; mas resisti ao diabo, e ele fugirá de vós."
referencia = "Tiago 4.7"
leitura = "A Guerra Invisível (p. 275–279)"
texto = [
  "Tiago põe duas ordens na mesma frase, e a ordem importa. Primeiro sujeitar-se a Deus, depois resistir ao diabo. Quem tenta resistir sem se sujeitar está lutando sozinho, e perde. Quem se dobra diante de Deus fica de pé diante do inimigo.",
  "Sujeitar-se, na prática, passa pela oração. Paulo termina a passagem da armadura mandando orar em todo tempo, vigiando e pedindo por todos os santos (Efésios 6.18). A oração não é um enfeite da batalha. É onde ela se decide.",
  "Resistir também é concreto. É sair da conversa, fechar a aba, não mandar a mensagem, pedir perdão antes que a mágoa endureça. O diabo não foge de gritos. Foge de um homem que obedece a Deus no detalhe.",
]
perguntas = [
  "Em que área eu tento resistir sem antes me sujeitar a Deus?",
  "Que obediência pequena e concreta seria resistir ao diabo hoje?",
]
desafio = "Separar 15 minutos sem interrupção para orar hoje, de joelhos se puder, incluindo três irmãos pelo nome. Depois fazer a obediência pequena que você anotou."
oracao = "Sujeitar-se a Deus em voz alta nas áreas em que você resiste a Ele, pedir força para obedecer no detalhe e interceder pelos homens do seu grupo."
resposta = "A obediência concreta de hoje"

[[dia]]
titulo = "A guerra já tem vencedor"
versiculo = "E, despojando os principados e as potestades, publicamente os expôs ao desprezo, triunfando deles na cruz."
referencia = "Colossenses 2.15"
leitura = "A Guerra Invisível (p. 280–283)"
texto = [
  "Na cruz, parecia que o inimigo tinha ganhado. Jesus estava nu, humilhado, morrendo. Paulo diz o contrário: foi ali que os poderes das trevas foram desarmados e expostos ao ridículo. A cruz não foi a derrota de Cristo. Foi o desfile da vitória dele.",
  "Isso muda o jeito de lutar. Você não luta para ganhar a guerra. Luta a partir de uma guerra já ganha. O inimigo ainda ataca e ainda fere, mas não tem mais o direito de acusar quem está em Cristo. A dívida foi paga e o documento contra nós foi cravado na cruz (Colossenses 2.14).",
  "Feche a semana olhando para trás. Você viu que o inimigo é real, vestiu a armadura, empunhou a Palavra, resistiu de joelhos e terminou olhando para a cruz. Na semana que vem o assunto é disciplina e governo de si: os hábitos que mantêm um homem de pé depois que a emoção passa.",
]
perguntas = [
  "Que acusação antiga eu ainda aceito como se Cristo não a tivesse pago?",
  "Como seria lutar a partir da vitória, e não para conquistá-la?",
]
desafio = "Escrever a acusação que mais pesa sobre você, ler Colossenses 2.13-15 por cima dela e depois rasgar o papel."
oracao = "Agradecer pela vitória de Cristo na cruz, entregar a Ele a acusação que você escreveu e pedir para lutar com confiança, não com medo."
resposta = "A acusação que Cristo já pagou"

[ebd]
titulo = "A guerra invisível"
texto_base = "Efésios 6.10-18 e Mateus 4.1-11"
objetivo = "Ajudar cada homem a encarar a batalha espiritual com sobriedade bíblica, usando os meios que Deus deu: fé, Palavra, oração e obediência."
verdade = "A luta do cristão é real, mas Cristo já venceu na cruz. O homem fica firme vestindo o que recebeu no evangelho e resistindo com a Palavra e a oração."
esboco = [
  { ponto = "Um inimigo real, uma postura sóbria", referencias = "1 Pedro 5.8-9; Efésios 6.10-12", explicacao = "A Bíblia não nega o diabo nem o exagera. Pede vigilância e firmeza na fé. A luta não é contra pessoas, mas contra forças espirituais que agem por ciladas." },
  { ponto = "A armadura é o evangelho vestido", referencias = "Efésios 6.13-18; Mateus 4.1-11", explicacao = "Verdade, justiça, paz, fé, salvação e Palavra são realidades que Cristo dá. Jesus venceu a tentação citando a Escritura, e a passagem da armadura termina em oração constante." },
  { ponto = "Lutar a partir da vitória", referencias = "Colossenses 2.13-15; Tiago 4.7", explicacao = "Na cruz, Cristo desarmou os poderes e cancelou a dívida. O cristão resiste ao diabo sujeitando-se a Deus, não com fórmulas, mas com obediência confiante." },
]
perguntas = [
  "Quais são os exageros mais comuns sobre batalha espiritual que você já viu? E qual é o perigo de ignorar o assunto?",
  "Por que Jesus respondeu ao tentador com a Escritura e não com uma demonstração de poder?",
  "Qual peça da armadura os homens da nossa igreja mais deixam de lado?",
  "O que muda na prática quando um homem luta sabendo que Cristo já venceu?",
]
aplicacao = "Cada aluno escolhe um versículo que responde à sua tentação mais frequente, decora-o durante a semana e o recita para outro homem da classe no próximo domingo."
professor = [
  "Mantenha a aula na linha reformada: o diabo é real, mas não é igual a Deus, não tem autoridade sobre o cristão e não deve ser o centro da conversa. O centro é Cristo e a sua vitória.",
  "Evite dar ao diabo crédito pelo pecado de cada um. Tiago 1.14 lembra que somos tentados pela nossa própria cobiça. A batalha também é contra a carne.",
  "Se alguém relatar experiências espirituais estranhas, não ridicularize nem alimente. Ouça com calma e encaminhe para conversa com o pastor.",
  "Homens que sofrem de ansiedade ou depressão não devem ouvir que isso é “ataque espiritual” e só. Incentive oração e também acompanhamento médico quando for o caso.",
]

[grupo]
abertura = "Café e oração curta. Pergunte às duplas se usaram a pergunta difícil que combinaram na semana passada."
quebra_gelo = "Qual foi a maior briga que você comprou quando era moleque, e quem ganhou?"
leitura = "Efésios 6.10-18 e Mateus 4.1-4, em voz alta, por dois homens diferentes."
conversa = [
  "Qual barreira prática você montou no dia 46? Ela funcionou durante a semana?",
  "Que peça da armadura você escolheu vestir no dia 47, e onde ela fez diferença?",
  "Recite o versículo que você decorou no dia 48. Ele veio à memória na hora da tentação?",
  "Como foram os 15 minutos de oração do dia 49? O que mais atrapalha você a orar?",
  "Sem precisar dizer qual era, como foi rasgar a acusação no dia 50?",
]
desafio = "Fazer os 5 dias da semana 11 e mandar à sua dupla, no meio da semana, o versículo que você decorou, perguntando qual é o dele."
oracao = "As duplas oram uma pela outra pelo ponto vulnerável que cada um anotou no dia 46. Encerrar com um homem agradecendo a vitória de Cristo na cruz."
