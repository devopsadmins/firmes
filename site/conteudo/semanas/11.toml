semana = 11
titulo = "Disciplina e governo de si"
pilar = "Liderança"
capitulo = "A Disciplina dos Homens Extraordinários"
complementar = "Seja Homem: Mente de governo (p. 161–172) e Sabedoria para governar (p. 211–220)"
resumo = "Quem não governa a si mesmo não consegue liderar ninguém, e a disciplina cristã nasce da graça recebida, não da tentativa de merecê-la."

[[dia]]
titulo = "Como costumava fazer"
versiculo = "Três vezes por dia, se punha de joelhos, e orava, e dava graças, diante do seu Deus, como costumava fazer."
referencia = "Daniel 6.10"
leitura = "A Disciplina dos Homens Extraordinários (p. 284–289)"
texto = [
  "Daniel soube que a lei contra a oração estava assinada. Foi para casa, abriu a janela e orou. O texto não diz que ele teve uma coragem repentina. Diz que fez como costumava fazer. A firmeza daquele dia foi construída em décadas de dias comuns.",
  "Disciplina não é ganhar pontos com Deus. Daniel orava porque já pertencia a Ele, e a oração era o lugar onde a vida dele se mantinha de pé. A graça vem primeiro. A disciplina é a resposta de quem foi alcançado por ela.",
  "Ninguém decide ser fiel na hora da prova. Na hora da prova você só faz o que já vinha fazendo. Por isso o hábito pequeno de hoje é uma preparação para um dia que você ainda não conhece.",
]
perguntas = [
  "Se a minha fé fosse proibida amanhã, que hábito ela teria para se segurar?",
  "Eu vejo a disciplina espiritual como dívida a pagar ou como resposta à graça?",
]
desafio = "Escolher um horário e um lugar fixos para orar todos os dias desta semana, e orar ali hoje por pelo menos 10 minutos."
oracao = "Agradecer porque Deus o aceitou em Cristo antes de qualquer esforço, pedir constância nos dias comuns e entregar a Ele o horário que você escolheu."
resposta = "Meu horário e lugar de oração"

[[dia]]
titulo = "De dia e de noite"
versiculo = "Antes, o seu prazer está na lei do SENHOR, e na sua lei medita de dia e de noite."
referencia = "Salmo 1.2"
leitura = "A Disciplina dos Homens Extraordinários (p. 290–294)"
texto = [
  "O Salmo 1 compara o homem que medita na Palavra a uma árvore plantada junto a águas. A árvore não faz força para dar fruto. Ela só fica perto da água. O fruto vem da raiz bem plantada, no tempo certo.",
  "Repare que o salmo fala de prazer antes de falar de disciplina. Muito homem lê a Bíblia como quem toma remédio: rápido, sem gosto, para cumprir tabela. O Salmo 119 mostra outro caminho. O salmista pede, pergunta, reclama, se alegra. Ele conversa com Deus enquanto lê.",
  "Meditar é mastigar. É ler pouco e pensar muito, voltar ao texto no meio do dia, perguntar o que ele diz sobre Deus e sobre você. Um versículo levado no bolso o dia inteiro faz mais do que três capítulos lidos com pressa.",
]
perguntas = [
  "Eu leio a Bíblia com prazer ou só por obrigação?",
  "O que costuma ocupar o lugar da Palavra nos meus primeiros minutos do dia?",
]
desafio = "Ler o Salmo 1 de manhã, escolher um versículo e voltar a ele três vezes ao longo do dia (no almoço, no fim do expediente e antes de dormir)."
oracao = "Pedir a Deus prazer na Palavra, e não só disciplina, e agradecer porque Ele fala com você pela Escritura."
resposta = "O versículo que mastiguei hoje"

[[dia]]
titulo = "O corpo também é campo"
versiculo = "Mas esmurro o meu corpo e o reduzo à escravidão, para que, tendo pregado a outros, não venha eu mesmo a ser desqualificado."
referencia = "1 Coríntios 9.27"
leitura = "A Disciplina dos Homens Extraordinários (p. 295–299)"
texto = [
  "Paulo usa a imagem do atleta que treina, corre e luta com objetivo. Ele não despreza o corpo, mas também não obedece a ele. O corpo é servo, não patrão. Quem deixa o corpo mandar acaba desqualificado, por mais que saiba ensinar os outros.",
  "Isso inclui sono, comida, bebida, exercício, tela e desejo. Um homem que dorme quatro horas, come qualquer coisa e não consegue largar o celular não está só cansado. Está sendo governado por coisas que deveria governar.",
  "Não se trata de culto ao corpo nem de vaidade. Seu corpo é templo do Espírito e ferramenta de serviço. Cuidar dele é mordomia. Negar a ele o que pede na hora errada é treino para dizer não a coisas maiores.",
]
perguntas = [
  "Em que área o meu corpo dá ordens e eu obedeço?",
  "Que cuidado com a saúde eu venho adiando por preguiça ou orgulho?",
]
desafio = "Fazer hoje um ato concreto de domínio sobre o corpo: dormir no horário, caminhar 30 minutos, cortar um excesso ou ficar o dia sem uma coisa que você sente que o domina."
oracao = "Agradecer pelo corpo que Deus lhe deu, confessar onde ele tem mandado em você e pedir domínio próprio como fruto do Espírito."
resposta = "Onde meu corpo manda e o que fiz hoje"

[[dia]]
titulo = "Cidade sem muros"
versiculo = "Mas o fruto do Espírito é: amor, alegria, paz, longanimidade, benignidade, bondade, fidelidade, mansidão, domínio próprio."
referencia = "Gálatas 5.22-23"
leitura = "A Disciplina dos Homens Extraordinários (p. 300–304)"
texto = [
  "Provérbios compara o homem sem domínio próprio a uma cidade derribada, sem muros (Provérbios 25.28). Na antiguidade, uma cidade assim não precisava de exército para ser saqueada. O homem sem domínio próprio também: qualquer irritação o leva, qualquer oferta o compra, qualquer impulso o arrasta.",
  "Paulo põe o domínio próprio na lista do fruto do Espírito. Não é uma técnica de autoajuda nem um traço de temperamento. É o Espírito de Cristo reconstruindo o muro por dentro, de modo que a ira não dita a resposta, o desejo não decide a compra e o humor não define o dia.",
  "O dinheiro é um bom teste. A fatura do cartão conta a verdade sobre quem governa a sua vida. Muitos homens vivem endividados não por falta de renda, mas por falta de muro.",
]
perguntas = [
  "Onde o meu muro está mais baixo: na ira, nas compras, na língua, no desejo?",
  "O que a minha última fatura diz sobre quem governa a minha vida?",
]
desafio = "Abrir a última fatura ou extrato e marcar tudo o que foi gasto por impulso. Escolher um gasto para cortar este mês e contar isso à sua esposa ou à sua dupla."
oracao = "Confessar a área em que você vive sem muro, pedir ao Espírito domínio próprio e entregar a Deus as suas finanças como de quem cuida do que é dele."
resposta = "O muro que vou reconstruir"

[[dia]]
titulo = "Pedir sabedoria"
versiculo = "Se, porém, algum de vós necessita de sabedoria, peça-a a Deus, que a todos dá liberalmente e nada lhes impropera; e ser-lhe-á concedida."
referencia = "Tiago 1.5"
leitura = "A Disciplina dos Homens Extraordinários (p. 305–309)"
texto = [
  "Quando Deus disse a Salomão “pede-me o que queres”, o jovem rei não pediu riqueza, vitória nem vida longa. Pediu um coração que soubesse ouvir para governar o povo (1 Reis 3.9). Ele sabia que o cargo era maior do que ele.",
  "Todo homem governa alguma coisa: uma casa, uma equipe, uma conta bancária, a própria agenda. A tentação é decidir no impulso ou no orgulho e só orar quando dá errado. Tiago oferece outro caminho: pedir sabedoria antes, com a certeza de que Deus dá sem humilhar quem pede.",
  "Feche a semana assim: você treinou a oração, a Palavra, o corpo e o domínio próprio. Nada disso é para ganhar o favor de Deus. É para governar bem o que Ele já colocou nas suas mãos. Na semana que vem, a última, o assunto são as resoluções para a vida inteira.",
]
perguntas = [
  "Que decisão está na minha frente e eu ainda não levei a Deus em oração?",
  "Em que área eu costumo decidir por impulso ou por orgulho?",
]
desafio = "Escrever a decisão mais importante desta semana, orar por ela pedindo sabedoria com as palavras de Tiago 1.5 e pedir a opinião de um homem mais maduro antes de decidir."
oracao = "Pedir a Deus um coração que saiba ouvir, reconhecer que a tarefa é maior do que você e agradecer porque Ele dá sabedoria sem humilhar."
resposta = "A decisão que levei a Deus e o conselho que recebi"

[ebd]
titulo = "Disciplina e governo de si"
texto_base = "Daniel 6.10 e 1 Coríntios 9.24-27"
objetivo = "Levar cada homem a ver a disciplina espiritual como resposta à graça e a assumir o governo de si mesmo em oração, Palavra, corpo, impulsos e tempo."
verdade = "Deus nos aceita em Cristo pela graça, e essa graça nos ensina a viver com domínio próprio. Quem se governa diante de Deus está pronto para servir aos outros."
esboco = [
  { ponto = "A firmeza nasce do hábito", referencias = "Daniel 6.10; Salmo 1.1-3", explicacao = "Daniel não improvisou fidelidade: orou como costumava fazer. O homem do Salmo 1 é árvore plantada junto à água. Os meios de graça diários sustentam o homem na hora da prova." },
  { ponto = "O corpo e os impulsos sob governo", referencias = "1 Coríntios 9.24-27; Provérbios 25.28; Gálatas 5.22-23", explicacao = "Paulo treina como atleta para não ser desqualificado. Provérbios compara o homem sem domínio a uma cidade sem muros, e Paulo mostra que o domínio próprio é fruto do Espírito, não só esforço humano." },
  { ponto = "Sabedoria para governar a vida", referencias = "Salmo 90.12; 1 Reis 3.7-10; Tiago 1.5", explicacao = "A vida é curta, e o tempo e o dinheiro precisam de governo. Salomão pediu sabedoria e foi atendido. Deus promete dá-la a quem pede." },
]
perguntas = [
  "Qual a diferença entre a disciplina como resposta à graça e a disciplina como tentativa de ganhar o favor de Deus?",
  "Que hábito sustentou você numa fase difícil da vida?",
  "Se o domínio próprio é fruto do Espírito, qual é o papel do nosso esforço? Como as duas coisas andam juntas?",
  "Se alguém olhasse a sua agenda e o seu extrato, o que diria sobre quem governa a sua vida?",
]
aplicacao = "Cada aluno escolhe uma disciplina para praticar todos os dias até o próximo domingo (oração em horário fixo, leitura de um salmo ou um corte de gasto) e pede a outro homem que o cobre."
professor = [
  "Insista que a disciplina não compra o amor de Deus. Tito 2.11-12 mostra que é a graça que nos educa para viver com sensatez. Sem isso, a aula vira legalismo.",
  "Evite transformar o ponto do corpo em culto à aparência ou em julgamento sobre peso. Há homens com doenças e limitações físicas na classe.",
  "No ponto sobre dinheiro, cuidado com quem está desempregado ou endividado por motivos fora do controle. Ofereça ajuda prática da igreja em vez de culpa.",
  "Peça exemplos concretos de horários, hábitos e cortes. Homens respondem melhor ao específico do que ao genérico.",
]

[grupo]
abertura = "Café e oração curta. Pergunte às duplas se trocaram os versículos decorados durante a semana."
quebra_gelo = "Qual foi o hábito mais estranho ou mais rígido que você já teve, em qualquer área da vida?"
leitura = "Daniel 6.10 e Gálatas 5.22-25, em voz alta, por dois homens diferentes."
conversa = [
  "Que horário e lugar de oração você escolheu no dia 51? Conseguiu manter durante a semana?",
  "Qual versículo você mastigou no dia 52? O que ele disse a você ao longo do dia?",
  "Que ato de domínio sobre o corpo você fez no dia 53? Foi mais fácil ou mais difícil do que esperava?",
  "Sem precisar de números, o que a fatura mostrou no dia 54? Qual gasto você decidiu cortar?",
  "Que decisão você levou a Deus no dia 55? Quem você ouviu antes de decidir?",
]
desafio = "Fazer os 5 dias da semana 12, a última. Durante a semana, reler o que você escreveu nos espaços de resposta desde o dia 01 e trazer ao encontro final a resposta que mais marcou você."
oracao = "As duplas oram uma pela outra pela disciplina que cada um escolheu. Encerrar com um homem pedindo sabedoria para todos, como Salomão pediu."
